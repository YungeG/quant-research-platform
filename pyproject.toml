[project]
name = "crypto-quant-research"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crypto-quant-bundle-builder==0.1.0",
  "crypto-quant-domain==0.1.0",
  "crypto-quant-foundation==0.1.0",
  "crypto-quant-validation==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_quant_research"]
